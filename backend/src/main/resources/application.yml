server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:100}
      min-spare: ${TOMCAT_MIN_SPARE:10}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:1000}

spring:
  application:
    name: leave-management-backend
  devtools:
    restart:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leave_mgt_db?currentSchema=identity,leave,public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 900000
      connection-timeout: 20000
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:schema.sql
      continue-on-error: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: identity

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000} # 15 minutes
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

app:
  timezone: ${APP_TIMEZONE:Africa/Nairobi}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  seed-admin-user: ${SEED_ADMIN_USER:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
    max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  auth:
    require-registration-approval: ${REQUIRE_REGISTRATION_APPROVAL:true}
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lockout-duration-minutes: ${AUTH_LOCKOUT_DURATION_MINUTES:15}
    rate-limiter:
      max-entries: ${RATE_LIMITER_MAX_ENTRIES:10000}
  admin:
    email: ${ADMIN_EMAIL:hr.admin@company.com}
    password: ${ADMIN_PASSWORD:Admin123!}
    employee-code: ${ADMIN_EMPLOYEE_CODE:EMP-00001}
    first-name: ${ADMIN_FIRST_NAME:System}
    last-name: ${ADMIN_LAST_NAME:Admin}
    job-title: ${ADMIN_JOB_TITLE:HR Administrator}
    phone: ${ADMIN_PHONE:+254700000000}
  helpdesk:
    max-attachment-size-bytes: ${MAX_ATTACHMENT_SIZE_BYTES:10485760} # 10MB
    allowed-attachment-extensions: ${ALLOWED_ATTACHMENT_EXTENSIONS:pdf,png,jpg,jpeg,gif,webp,txt,csv,doc,docx,xls,xlsx,zip}
    attachment-storage-dir: ${ATTACHMENT_STORAGE_DIR:uploads/tickets}
  notification:
    slack-webhook-url: ${SLACK_WEBHOOK_URL:}
    from-email: ${MAIL_FROM:noreply@company.com}
  scheduling:
    sla-monitor-rate-ms: ${SLA_MONITOR_RATE_MS:60000}
    accrual-cron: ${ACCRUAL_CRON:0 0 1 1 * *}
    outbox-poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
